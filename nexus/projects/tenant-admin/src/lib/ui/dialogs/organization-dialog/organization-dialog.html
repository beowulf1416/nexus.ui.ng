<div class="component organization-dialog">
  <div class="wrapper form">
    <form class="organization" method="post" action="" (submit)="save($event)">
      <h3 mat-dialog-title>
        <span class="material-symbols-outlined icon">
        network_node
        </span>
        <span>{{ title() }}</span>
      </h3>
      <mat-dialog-content>
        <fieldset>
          <legend>Information</legend>
          <mat-form-field class="field block">
            <mat-label>Name</mat-label>
            <input type="text" title="Name" class="input name" matInput [formField]="component.form.name"/>
          </mat-form-field>
          <mat-form-field class="field block">
            <mat-label>Description</mat-label>
            <textarea title="Description" class="input description" matInput [formField]="component.form.description"></textarea>
          </mat-form-field>
        </fieldset>
        <fieldset>
          <legend>Hierarchy</legend>
          <organization-selector (organization_selected)="on_selected($event)"></organization-selector>
        </fieldset>
      </mat-dialog-content>
      <mat-dialog-actions>
        <button type="button" title="Cancel" class="btn cancel" matFab extended (click)="on_cancel($event)">
          <mat-icon>cancel</mat-icon>
          <span>Cancel</span>
        </button>
        <button type="submit" title="Save" class="btn save" matFab extended>
          <mat-icon>save</mat-icon>
          <span>Save</span>
        </button>
      </mat-dialog-actions>
      <input type="hidden" [formField]="component.form.org_id" />
    </form>
  </div><!-- .wrapper -->
</div><!-- .component -->
