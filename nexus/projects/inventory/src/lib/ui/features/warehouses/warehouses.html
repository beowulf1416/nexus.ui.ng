<div class="component warehouses">
  <div class="wrapper form">
    <form class="warehouses" method="post" action="" novalidate>
      <div class="wrapper toolbar">
        <mat-toolbar>
          <button type="button" title="New Warehouse" class="btn warehouse" mat-icon-button (click)="on_new_warehouse($event)">
            <mat-icon>warehouse</mat-icon>
          </button>
          <div class="wrapper filter">
            <mat-form-field appearance="outline">
              <input type="search" placeholder="Search" matInput [formField]="component.form.filter" />
              <button type="button" title="Search" class="btn search" mat-icon-button (click)="on_search($event)" matSuffix>
                <mat-icon>search</mat-icon>
              </button>
              <button type="button" title="Clear" class="btn clear" mat-icon-button (click)="on_clear($event)" matSuffix>
                <mat-icon>close_small</mat-icon>
              </button>
            </mat-form-field>
          </div><!-- .wrapper -->
          <button type="button" title="Refresh" class="btn refresh" mat-icon-button (click)="on_refresh($event)">
            <mat-icon>refresh</mat-icon>
          </button>
        </mat-toolbar>
      </div><!-- .wrapper -->
      <div class="wrapper table">
        <table class="warehouses">
          <caption>Warehouses</caption>
          <thead>
            <tr>
              <th></th>
              <th>Name</th>
              <th>Description</th>
            </tr>
          </thead>
          <tfoot></tfoot>
          <tbody>
            @for(w of component.form.warehouses; let even = $even; let i = $index; track i) {
              <tr class="warehouse-item" [class]="even ? 'even' : 'odd'">
                <td>
                  <input type="checkbox" title="Select Item" class="input select-item" [formField]="w.selected" />
                </td>
                <td>{{ w.warehouse.name().value() }}</td>
                <td>{{ w.warehouse.description().value() }}</td>
              </tr>
            }
          </tbody>
        </table>
      </div><!-- .wrapper -->
    </form>
  </div><!-- .wrapper -->
</div><!-- .component -->
