<div class="component transactions">
  <div class="wrapper form">
    <form class="transactions" method="post" action="">
      <mat-toolbar>
        <mat-menu #mnu_transactions="matMenu">
          <a title="Purchase Order" class="purchase-order" [routerLink]="['po']" mat-menu-item>
            <mat-icon>add</mat-icon>
            <span>Purchase Order</span>
          </a>
          <a title="Receiving" class="receiving" [routerLink]="['receiving']" mat-menu-item>
            <mat-icon>receiving</mat-icon>
            <span>Receiving</span>
          </a>
        </mat-menu>
        <button type="button" [matMenuTriggerFor]="mnu_transactions" class="btn menu" mat-icon-button>
          <mat-icon>menu</mat-icon>
        </button>
        <mat-form-field appearance="outline">
          <mat-label>Search</mat-label>
          <input type="search" title="Search" class="input search" matInput [formField]="component.form.filter" />
          <button type="button" title="Seach" class="btn search" mat-icon-button matSuffix (click)="on_search($event)">
            <mat-icon>search</mat-icon>
          </button>
          <button type="button" title="Clear" class="btn clear" mat-icon-button matSuffix (click)="on_clear($event)">
            <mat-icon>close_small</mat-icon>
          </button>
        </mat-form-field>
      </mat-toolbar>
      <div class="wrapper">
        <table class="transactions">
          <caption>Transactions</caption>
          <thead>
            <tr>
              <th></th>
              <th>Description</th>
              <th></th>
              <th></th>
            </tr>
          </thead>
          <tfoot></tfoot>
          <tbody>
            <tr>
              <td></td>
              <td></td>
              <td></td>
              <td></td>
            </tr>
          </tbody>
        </table>
      </div><!-- .wrapper -->
    </form>
  </div><!-- .wrapper -->
</div><!-- .component -->
