<div class="component purchase-order">
  <div class="wrapper form">
    <form class="purchase-order" method="post" action="" (submit)="on_submit($event)">
      <div class="wrapper actions">
        <mat-toolbar>
          <button type="submit" title="Save" class="btn save" mat-icon-button>
            <mat-icon>save</mat-icon>
          </button>
        </mat-toolbar>
      </div><!-- .wrapper -->
      <fieldset>
        <legend>General Information</legend>
        <mat-form-field appearance="outline">
          <mat-label>Description</mat-label>
          <textarea title="Description" class="input description" matInput [formField]="component.form.description"></textarea>
        </mat-form-field>
      </fieldset>
      <fieldset>
        <legend>Items</legend>
        <div class="wrapper table">
          <table>
            <caption>Items</caption>
            <thead>
              <tr>
                <th></th>
                <th>Name</th>
                <th>Description</th>
                <th>Quantity</th>
                <th>UOM</th>
                <th>Action</th>
              </tr>
            </thead>
            <tfoot>
              <tr>
                <td colspan="3">
                  <item-selector (items_selected)="on_items_selected($event)"></item-selector>
                </td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
              </tr>
            </tfoot>
            <tbody>
              @for(item of component.form.items; let even = $even; let i = $index; track item.item.item_id){
              <tr>
                <td></td>
                <td>{{ item.item.name().value() }}</td>
                <td>{{ item.item.description().value() }}</td>
                <td>
                  <mat-form-field appearance="outline">
                    <mat-label>Quantity</mat-label>
                    <input type="number" title="Ordered" inputmode="decimal" increment="0.01" class="input ordered" matInput [formField]="component.form.new_item.quantity"/>
                  </mat-form-field>
                </td>
                <td>
                  <uom-selector [formField]="component.form.new_item.uom_id"></uom-selector>
                </td>
                <td>
                  <button type="button" title="Remove Item" class="btn remove-item" mat-icon-button>
                    <mat-icon>remove</mat-icon>
                  </button>
                </td>
              </tr>
              }
            </tbody>
          </table>
        </div><!-- .wrapper table -->
      </fieldset>
    </form>
  </div><!-- .wrapper -->
</div><!-- .component -->
