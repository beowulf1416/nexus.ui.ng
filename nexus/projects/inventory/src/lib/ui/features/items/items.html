<div class="component items">
  <div class="wrapper form">
    <form class="items" method="post" action="" novalidate>
      <div class="wrapper toolbar">
        <mat-toolbar>
          <button type="button" title="New Item" class="btn item" mat-icon-button (click)="on_new_item($event)">
            <mat-icon><span class="material-symbols-outlined">
            box_add
            </span></mat-icon>
          </button>
          <button type="button" title="New Warehouse" class="btn warehouse" mat-icon-button (click)="on_new_warehouse($event)">
            <mat-icon>warehouse</mat-icon>
          </button>
          <button type="button" title="New Location" class="btn location" mat-icon-button (click)="on_new_location($event)">
            <mat-icon>location_on</mat-icon>
          </button>
          <div class="wrapper filter">
            <mat-form-field appearance="outline">
              <input type="search" placeholder="Search" matInput />
              <button type="button" title="Search" class="btn search" mat-icon-button (click)="on_search($event)" matSuffix>
                <mat-icon>search</mat-icon>
              </button>
              <button type="button" title="Clear" class="btn clear" mat-icon-button (click)="on_clear($event)" matSuffix>
                <mat-icon>close_small</mat-icon>
              </button>
            </mat-form-field>
          </div><!-- .wrapper -->
          <button type="button" title="Refresh" class="btn refresh" mat-icon-button (click)="on_refresh($event)">
            <mat-icon>refresh</mat-icon>
          </button>
        </mat-toolbar>
      </div><!-- .wrapper -->
      <div class="wrapper table">
        <table class="items">
          <caption>Items</caption>
          <thead>
            <tr>
              <th>
                <input type="checkbox" title="Select All" class="input select-all" (change)="on_select_all($event)" />
              </th>
              <th>Name</th>
              <th>Description</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tfoot></tfoot>
          <tbody>
            @for(item of component.form.items; let even = $even; track item.item.item_id) {
              <tr class="item" [class]="even ? 'even' : 'odd'">
                <td>
                  <input type="checkbox" title="Select Item" class="input select-item" />
                </td>
                <td>{{ item.item.name().value() }}</td>
                <td>{{ item.item.description().value() }}</td>
                <td>
                  <a title="Edit" class="action edit" [routerLink]="[item.item.item_id().value()]">edit</a>
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div><!-- .wrapper -->
    </form>
  </div><!-- .wrapper -->
</div><!-- .component -->
