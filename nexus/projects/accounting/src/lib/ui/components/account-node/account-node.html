<tr class="account-node">
  <td>{{ account().name }}</td>
  <td>{{ account().code }}</td>
  <td>{{ account().description }}</td>
  <td>{{ account().balance }}</td>
</tr>
@if(account().child_accounts.length > 0){
<tr>
  <td colspan="4">
    <div class="wrapper">
      <table>
        <tbody>
          @for(acct of account().child_accounts; let i = $index; track $index){
          <tr>
            <td>{{ acct.name }}</td>
            <td>{{ acct.code }}</td>
            <td>{{ acct.description }}</td>
            <td>{{ acct.balance }}</td>
          </tr>
          }
        </tbody>
      </table>
    </div>
    <!-- .wrapper -->
  </td>
</tr>
}
