<div class="component accounts">
  <div class="wrapper toolbar">
    <mat-toolbar>
      <button type="button" title="New Account" mat-icon-button (click)="on_new_account($event)">
        <mat-icon>account_balance_wallet</mat-icon>
        <span>New Account</span>
      </button>
      <button type="button" title="refresh" mat-icon-button (click)="on_refresh($event)">
        <mat-icon>refresh</mat-icon>
      </button>
    </mat-toolbar>
  </div><!-- .wrapper -->
  <div class="wrapper accounts">
    <table class="accounts">
      <caption>
        Chart of Accounts
      </caption>
      <thead>
        <tr>
          <th></th>
          <th>Name</th>
          <th>Code</th>
          <th>Amount</th>
        </tr>
      </thead>
      <tfoot>
        <tr>
          <td colspan="4"></td>
        </tr>
      </tfoot>
      <tbody>
        @for(acct_type of model().account_types; let i = $index; track $index){
        <tr>
          <td>{{ acct_type.account_type_id }}</td>
          <td>{{ acct_type.name }}</td>
          <td></td>
          <td></td>
        </tr>
        }
        <tr>
          <td>Asset</td>
          <td></td>
          <td></td>
        </tr>
        <tr>
          <td colspan="3">
            <div class="wrapper table">
              <table>
                <thead></thead>
                <tbody>
                  @for(a of model().assets; let i = $index; track $index){
                  <tr>
                    <td>{{ a.name }}</td>
                    <td></td>
                    <td></td>
                  </tr>
                  }
                </tbody>
              </table>
            </div><!-- .wrapper -->
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <!-- .wrapper -->
</div>
<!-- .component -->
