<div class="component accounts">
  <div class="wrapper accounts">
    <table class="accounts">
      <caption>
        Chart of Accounts
      </caption>
      <thead>
        <tr>
          <th></th>
          <th>Name</th>
          <th>Code</th>
          <th>Amount</th>
        </tr>
      </thead>
      <tfoot>
        <tr>
          <td colspan="4"></td>
        </tr>
      </tfoot>
      <tbody>
        @for(acct of model().accounts; let i = $index; track $index){
        <account-node [account]="acct"></account-node>
        }
      </tbody>
    </table>
  </div>
  <!-- .wrapper -->
</div>
<!-- .component -->
