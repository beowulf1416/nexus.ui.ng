<div class="component accounts">
  <div class="wrapper toolbar">
    <mat-toolbar>
      <button type="button" title="New Account" mat-icon-button (click)="on_new_account($event)">
        <mat-icon>account_balance_wallet</mat-icon>
        <span>New Account</span>
      </button>
      <button type="button" title="refresh" mat-icon-button (click)="on_refresh($event)">
        <mat-icon>refresh</mat-icon>
      </button>
    </mat-toolbar>
  </div><!-- .wrapper -->
  <div class="wrapper accounts">
    <table class="accounts">
      <caption>Accounts</caption>
      <thead>
        <tr>
          <th></th>
          <th>Name</th>
          <th>Code</th>
          <th>Balance</th>
        </tr>
      </thead>
      <tfoot>
        <tr>
          <td></td>
          <td>Name</td>
          <td>Code</td>
          <td>Balance</td>
        </tr>
      </tfoot>
      <tbody>
        @for(row of model().rows; track $index){
          <tr [class]="'level-' + row.level" [style.--level]="row.level">
            <td></td>
            <td class="name">{{ row.name }}</td>
            <td>{{ row.code }}</td>
            <td>{{ row.balance }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div><!-- .wrapper -->
</div>
<!-- .component -->
