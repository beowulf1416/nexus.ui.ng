<div class="component invoices">
  <div class="wrapper form">
    <form class="form-invoices" method="post" action="">
      <div class="wrapper actions">
        <mat-toolbar>
          <button
            type="button"
            class="btn invoice"
            title="New Invoice"
            aria-label="New Invoice"
            mat-icon-button
            (click)="new_invoice_dialog($event)"
          >
            <mat-icon>receipt</mat-icon>
          </button>
          <div class="separator">|</div>
          <div class="wrapper filter">
            <mat-form-field appearance="outline">
              <mat-label>Search</mat-label>
              <input
                type="search"
                class="input filter"
                placeholder="Filter"
                matInput
                [formField]="component.form.filter"
              />
              <button
                type="button"
                class="btn filter"
                title="Search"
                aria-label="Search"
                mat-icon-button
                matSuffix
                (click)="on_filter($event)"
              >
                <mat-icon>search</mat-icon>
              </button>
              <button
                type="button"
                class="btn reset"
                title="Clear"
                aria-label="Clear"
                mat-icon-button
                matSuffix
                [disabled]="reset_disabled()"
                (click)="on_reset_filter($event)"
              >
                <mat-icon>close_small</mat-icon>
              </button>
            </mat-form-field>
          </div>
          <!-- .wrapper filter -->
          <button
            type="button"
            class="btn refresh"
            title="Refresh"
            aria-label="Refresh"
            mat-icon-button
            (click)="on_refresh($event)"
          >
            <mat-icon>refresh</mat-icon>
          </button>
        </mat-toolbar>
        <div class="wrapper errors">
          @if (component.errors().length > 0) { @for (error of component.errors(); track error) {
          <div>{{ error }}</div>
          } }
        </div>
        <!-- .wrapper errors -->
        <div class="wrapper partners">
          <table class="partners">
            <caption>
              Partners
            </caption>
            <thead>
              <tr>
                <th>
                  <input
                    type="checkbox"
                    class="input check select-all"
                    title="Select All"
                    (click)="on_select_all($event)"
                  />
                </th>
                <th>Active</th>
                <th>Name</th>
                <th>Created</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tfoot>
              <tr>
                <th></th>
                <th>Active</th>
                <th>Name</th>
                <th>Created</th>
                <th>Actions</th>
              </tr>
            </tfoot>
            <tbody>
              @for (tr of component.form.invoices; let even = $even; let i = $index; track i) {
              <tr class="invoice-item" [class]="even ? 'even' : 'odd'">
                <td>
                  <input
                    type="checkbox"
                    class="input check select"
                    title="Select Item"
                    [formField]="tr.selected"
                  />
                </td>
                <td class="state">
                  <span class="material-symbols-outlined"> check_circle </span>
                </td>
                <td>{{ tr.name().value() }}</td>
                <td>
                  <button
                    type="button"
                    class="btn edit-invoice"
                    title="Edit Invoice"
                    mat-icon-button
                    (click)="on_edit_invoice($event, i)"
                  >
                    <mat-icon>edit</mat-icon>
                  </button>
                </td>
              </tr>
              }
            </tbody>
          </table>
        </div>
        <!-- .wrapper -->
      </div>
      <!-- .wrapper -->
    </form>
  </div>
  <!-- .wrapper -->
</div>
<!-- .component -->
