<div class="component invoice">
  <div class="wrapper form">
    <form class="invoice" method="post" action="" (submit)="on_submit($event)">
      <fieldset class="actions">
        <mat-toolbar>
          <button type="button" title="Save" class="btn invoice-save" mat-icon-button>
            <mat-icon>save</mat-icon>
          </button>
        </mat-toolbar>
      </fieldset>
      <fieldset>
        <legend>General</legend>
        <mat-form-field class="field block">
          <mat-label>Invoice Type</mat-label>
          <mat-select [formField]="component.form.invoice_type_id">
            @for (type of component.invoice_types(); track type.id) {
            <mat-option [value]="type.id">{{ type.name }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
        <mat-form-field class="field block">
          <mat-label>Due Date</mat-label>
          <input
            type="date"
            class="input due-date"
            matInput
            [formField]="component.form.due_date"
          />
        </mat-form-field>
        <mat-form-field class="field block">
          <mat-label>Description</mat-label>
          <textarea matInput [formField]="component.form.description"></textarea>
        </mat-form-field>
      </fieldset>
      <fieldset>
        <legend>Items</legend>
        <div class="wrapper items">
          <table class="items">
            <caption>
              Invoice Items
            </caption>
            <thead>
              <tr>
                <th>Description</th>
                <th>Quantity</th>
                <th>Unit Price</th>
                <th>Total</th>
              </tr>
            </thead>
            <tfoot>
              <tr>
                <td>
                  <mat-form-field>
                    <mat-label>Description</mat-label>
                    <input
                      type="text"
                      class="input description"
                      matInput
                      [formField]="component.form.new_item.description"
                    />
                  </mat-form-field>
                </td>
                <td>
                  <mat-form-field>
                    <mat-label>Quantity</mat-label>
                    <input
                      type="number"
                      title="Quantity"
                      class="input item-qty"
                      matInput
                      [formField]="component.form.new_item.quantity"
                    />
                  </mat-form-field>
                </td>
                <td>
                  <mat-form-field>
                    <input
                      type="number"
                      title="Unit Price"
                      class="input unit-price"
                      matInput
                      [formField]="component.form.new_item.unit_price"
                    />
                  </mat-form-field>
                </td>
                <td>
                  <input
                    type="number"
                    title="Total"
                    class="input unit_price"
                    readonly
                    matInput
                    [value]="new_item_total()"
                  />
                </td>
                <td>
                  <button
                    type="button"
                    title="Add Invoice Item"
                    class="btn add-invoice-item"
                    [disabled]="new_item_disabled()"
                    mat-icon-button
                  >
                    <mat-icon>add</mat-icon>
                  </button>
                </td>
              </tr>
            </tfoot>
            <tbody>
              <tr>
                @for (item of component.form.items; track item.id) {
                <td>
                  <mat-form-field>
                    <mat-label>Item Description</mat-label>
                    <input
                      type="text"
                      title="Description"
                      class="input item-description"
                      matInput
                    />
                  </mat-form-field>
                </td>
                <td>
                  <mat-form-field>
                    <mat-label>Quantity</mat-label>
                    <input type="number" title="Quantity" class="input item-qty" matInput />
                  </mat-form-field>
                </td>
                <td>
                  <mat-form-field>
                    <input type="number" title="Unit Price" class="input unit-price" matInput />
                  </mat-form-field>
                </td>
                <td>
                  <button type="button" title="Remove Invoice Item" class="btn remove-invoice-item">
                    <mat-icon>remove</mat-icon>
                  </button>
                </td>
                }
              </tr>
            </tbody>
          </table>
        </div>
        <!-- .wrapper -->
      </fieldset>
    </form>
  </div>
  <!-- .wrapper -->
</div>
<!-- .component -->
